<app-auth-shell>
  @if (checking) { <p class="access-wait" role="status">Verificando sua sessão…</p> }
  @else {
    <header class="access-heading"><h1>Bom ter você de volta.</h1><p>Entre para cuidar do seu cardápio.</p></header>
    @if (errorMessage) { <div class="access-alert" role="alert">{{ errorMessage }}</div> }
    @if (notice) { <div class="access-notice" role="status">{{ notice }}</div> }
    <form class="access-form" (ngSubmit)="onLogin()" #form="ngForm">
      <div class="access-field"><label for="login-email">E-mail</label><div class="access-input"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg><input id="login-email" name="email" type="email" [(ngModel)]="email" placeholder="seu@email.com" required email maxlength="254" autocomplete="username" autocapitalize="none" spellcheck="false" /></div></div>
      <div class="access-field"><label for="login-password">Senha</label><div class="access-input"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="login-password" name="password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" placeholder="Sua senha de acesso" required maxlength="128" autocomplete="current-password" /><button type="button" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'" [attr.aria-pressed]="showPassword"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>@if (showPassword) { <path d="m3 3 18 18"/> }</svg></button></div></div>
      <div class="access-links"><a routerLink="/forgot-password">Esqueci minha senha</a></div>
      <button type="submit" class="access-primary" [disabled]="isLoading || form.invalid" [attr.aria-busy]="isLoading">{{ isLoading ? 'Entrando…' : 'Entrar' }}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>
    </form>
    <p class="access-bottom">Ainda não tem uma conta? <a routerLink="/plans">Começar meu cardápio</a></p>
    <div class="access-security"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4v5c0 5-8 9-8 9s-8-4-8-9V7l8-4Z"/><path d="m8 12 3 3 5-6"/></svg>Seu próximo acesso começa com segurança.</div>
  }
</app-auth-shell>
